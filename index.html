<script>

(()=>{
  if(!('serviceWorker' in navigator))return;
  const cleanupKey='soap-cache-recovery-v762';
  const appPath=new URL('.',location.href).pathname;
  const inAppScope=scope=>{
    try{const path=new URL(scope).pathname;return path===appPath||path.startsWith(appPath.endsWith('/')?appPath:appPath+'/')}
    catch(e){return false}
  };
  navigator.serviceWorker.getRegistrations().then(async regs=>{
    const ownRegs=regs.filter(r=>inAppScope(r.scope));
    const ownController=!!(navigator.serviceWorker.controller&&ownRegs.some(r=>r.active&&r.active.scriptURL===navigator.serviceWorker.controller.scriptURL));
    if(ownRegs.length)await Promise.all(ownRegs.map(r=>r.unregister().catch(()=>false)));
    // No se vacía CacheStorage: sus cachés pertenecen al origen completo y podrían
    // ser utilizadas por otras aplicaciones alojadas bajo el mismo dominio.
    if((ownController||ownRegs.length)&&!sessionStorage.getItem(cleanupKey)){
      sessionStorage.setItem(cleanupKey,'1');location.reload();
    }else if(!ownRegs.length)sessionStorage.removeItem(cleanupKey);
  }).catch(()=>{});
})();

</script>

const soapGameFrame = document.getElementById('soapGameFrame');
let soapActiveVersion = 'current';
function soapDecodeHtml(encoded){
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
const SOAP_PAGES = {
  current: soapDecodeHtml(SOAP_CURRENT_B64),
  classic: soapDecodeHtml(SOAP_CLASSIC_B64)
};
window.__soapSwitchVersion = function(version){
  const next = version === 'classic' ? 'classic' : 'current';
  soapActiveVersion = next;
  try{ localStorage.setItem('soapVersionMode', next); }catch(e){}
  soapGameFrame.srcdoc = SOAP_PAGES[next];
  document.title = next === 'classic' ? 'Soap Adventures v5.5' : 'Soap Adventures v.7.72';
  return true;
};
let initialVersion = 'current';
try{ if(localStorage.getItem('soapVersionMode') === 'classic') initialVersion = 'classic'; }catch(e){}
window.__soapSwitchVersion(initialVersion);
</script>
